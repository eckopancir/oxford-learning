<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oxford 5000 | Cyber Learning</title>
    <link rel="stylesheet" href="stylewords.css" />
  </head>
  <body>
    <div class="stats-top-bar">
      <div class="stat-banner"><span class="label">A1:</span> <span id="stat-a1">0</span></div>
      <div class="stat-banner"><span class="label">A2:</span> <span id="stat-a2">0</span></div>
      <div class="stat-banner"><span class="label">B1:</span> <span id="stat-b1">0</span></div>
      <div class="stat-banner"><span class="label">B2:</span> <span id="stat-b2">0</span></div>
      <div class="stat-banner"><span class="label">C1:</span> <span id="stat-c1">0</span></div>

      <div class="divider">|</div>

      <div class="stat-banner highlighting" title="Доступно новых слов для изучения">
        <span class="label">AVAIL LEARN:</span> <span id="stat-avail-learn">0</span>
      </div>
      <div class="stat-banner highlighting" title="Повторение: Английский -> Русский">
        <span class="label">REV EN-RU:</span> <span id="stat-avail-eng">0</span>
      </div>
      <div class="stat-banner highlighting" title="Повторение: Русский -> Английский">
        <span class="label">REV RU-EN:</span> <span id="stat-avail-rus">0</span>
      </div>

      <div class="divider">|</div>

      <div class="stat-banner highlighting">
        <span class="label">TODAY NEW:</span> <span id="stat-today-new">0</span>
      </div>
      <div class="stat-banner highlighting">
        <span class="label">REVIEWS:</span> <span id="stat-today-rev">0</span>
      </div>

      <div class="divider">|</div>

      <div class="stat-banner record">
        <span class="label">WEEK BEST:</span> <span id="stat-week-record">0</span>
      </div>
      <div class="stat-banner record">
        <span class="label">TOTAL:</span> <span id="learned-stat">0</span>
      </div>
    </div>

    <div class="container">
      <div class="nav-header">
        <button class="glass-button active" onclick="location.reload()">Изучение</button>
        <button class="glass-button" onclick="showReviewOptions()">Изученные слова</button>
        <button class="glass-button" onclick="showJournal()">Журнал</button>
      </div>
      <div id="journal-screen" style="display: none">
        <div
          class="journal-mode-selector"
          style="
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
          "
        >
          <button id="j-mode-eng" class="glass-button active" onclick="setJournalMode('eng')">
            EN ➔ RU Progress
          </button>
          <button id="j-mode-rus" class="glass-button" onclick="setJournalMode('rus')">
            RU ➔ EN Progress
          </button>
        </div>
        <div id="journal-container">
          <table class="journal-table">
            <thead>
              <tr id="journal-header">
                <th onclick="sortJournal('word')">🔤 Слово</th>
                <th onclick="sortJournal('level')">📊 Уровень</th>
                <th onclick="sortJournal('views')">👁 Просмотры</th>
                <th onclick="sortJournal('days')">📅 Дней</th>
                <th onclick="sortJournal('score0')">0</th>
                <th onclick="sortJournal('score1')">1</th>
                <th onclick="sortJournal('score2')">2</th>
                <th onclick="sortJournal('score3')">3</th>
                <th onclick="sortJournal('score4')">4</th>
                <th onclick="sortJournal('diff')">📈 Прогресс</th>
              </tr>
            </thead>
            <tbody id="journal-grid"></tbody>
          </table>
        </div>
      </div>
      <script>
        function showReviewOptions() {
          // 1. Выбор направления
          const mode = confirm(
            'Выберите направление:\nOK — English -> Russian\nОтмена — Russian -> English',
          );

          // 2. Выбор сортировки
          const sortMode = confirm(
            'Выберите порядок слов:\nOK — Вперемешку (случайно)\nОтмена — Сначала самые слабые (Low Level)',
          );

          startReview(mode ? 'eng-rus' : 'rus-eng', sortMode ? 'random' : 'level');
        }
      </script>
      <div class="button-row">
        <div id="setup-panel">
          <div class="filter-group">
            <select id="filter-level" class="glass-select">
              <option value="all">Все уровни (A1-C1)</option>
              <option value="A1">Level A1</option>
              <option value="A2">Level A2</option>
              <option value="B1">Level B1</option>
              <option value="B2">Level B2</option>
              <option value="C1">Level C1</option>
            </select>

            <select id="filter-type" class="glass-select">
              <option value="all">Все части речи</option>
              <option value="v.">Глаголы (v.)</option>
              <option value="n.">Существительные (n.)</option>
              <option value="adj.">Прилагательные (adj.)</option>
              <option value="adv.">Наречия (adv.)</option>
            </select>
          </div>

          <button class="glass-button start-btn" onclick="generateNewList()">
            Сформировать список (20)
          </button>
          <button class="glass-button shuffle-btn" onclick="shuffleCurrentList()">
            Перемешать текущие
          </button>
        </div>
        <div id="tooltip" class="custom-tooltip"></div>
      </div>

      <div id="table-container" style="display: none">
        <table class="cyber-table">
          <thead>
            <tr>
              <th style="width: 40px">№</th>
              <th>Слово</th>
              <th>Транскрипция</th>
              <th>Перевод</th>
              <th style="width: 60px">Звук</th>
              <th style="width: 80px">Словарь</th>
              <th style="width: 60px">Статус</th>
            </tr>
          </thead>
          <tbody id="words-grid"></tbody>
        </table>
      </div>
      <div id="review-container" style="display: none; text-align: center; margin-top: 50px">
        <div class="review-card">
          <div
            id="review-mode-badge"
            style="
              font-size: 0.7rem;
              color: #4facfe;
              letter-spacing: 2px;
              margin-bottom: 5px;
              text-transform: uppercase;
              font-weight: bold;
            "
          ></div>

          <div id="review-level-tag" class="level-badge">LVL 1</div>

          <div
            class="review-display-wrapper"
            style="
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 15px;
              margin-top: 10px;
            "
          >
            <div
              id="review-word-display"
              class="main-word"
              style="font-size: 3.5rem; position: relative; cursor: help"
            >
              Word
            </div>
            <button
              class="audio-icon review-audio-btn"
              id="review-replay-audio"
              onclick="replayCurrentAudio()"
              style="font-size: 2rem; display: none"
            >
              🔊
            </button>
          </div>
          <div
            id="review-phonetic"
            style="color: #888; margin-bottom: 10px; font-family: monospace"
          >
            [phonetic]
          </div>

          <div
            id="review-translation"
            class="translation-cell"
            style="display: none; font-size: 1.8rem; margin: 25px 0; color: #00f2fe"
          >
            Перевод
          </div>

          <div class="review-controls">
            <button
              id="show-answer-btn"
              class="glass-button start-btn"
              onclick="showReviewAnswer()"
            >
              Показать ответ
            </button>

            <div
              id="rating-buttons"
              style="display: none; gap: 12px; justify-content: center; margin-top: 25px"
            >
              <button onclick="rateWord(0)" style="background: #ff4d4d" class="rate-btn">0</button>
              <button onclick="rateWord(1)" style="background: #ffa500" class="rate-btn">1</button>
              <button
                onclick="rateWord(2)"
                style="background: #ffff00; color: black"
                class="rate-btn"
              >
                2
              </button>
              <button
                onclick="rateWord(3)"
                style="background: #90ee90; color: black"
                class="rate-btn"
              >
                3
              </button>
              <button onclick="rateWord(4)" style="background: #006400" class="rate-btn">4</button>
            </div>
          </div>
        </div>
        <button class="glass-button" style="margin-top: 40px" onclick="location.reload()">
          Назад к списку
        </button>
      </div>
    </div>
    <div id="review-modal" class="modal-overlay" style="display: none">
      <div class="modal-content">
        <h2 style="color: #00ff41; margin-bottom: 20px; text-shadow: 0 0 10px #00ff41">
          ПАРАМЕТРЫ ПОВТОРЕНИЯ
        </h2>

        <div class="modal-group">
          <label>НАПРАВЛЕНИЕ:</label>
          <div class="modal-options">
            <button
              id="mode-en-ru"
              class="glass-button active"
              onclick="selectOption('mode', 'eng-rus')"
            >
              EN ➔ RU
            </button>
            <button id="mode-ru-en" class="glass-button" onclick="selectOption('mode', 'rus-eng')">
              RU ➔ EN
            </button>
          </div>
        </div>

        <div class="modal-group">
          <label>СОРТИРОВКА:</label>
          <div class="modal-options">
            <button
              id="sort-random"
              class="glass-button active"
              onclick="selectOption('sort', 'random')"
            >
              СЛУЧАЙНО
            </button>
            <button id="sort-level" class="glass-button" onclick="selectOption('sort', 'level')">
              СЛАБЫЕ (LVL)
            </button>
          </div>
        </div>

        <div class="modal-actions" style="margin-top: 30px">
          <button class="glass-button start-btn" onclick="confirmReviewStart()" style="width: 100%">
            ЗАПУСТИТЬ ТРЕНИРОВКУ
          </button>
          <button
            class="glass-button"
            onclick="closeModal()"
            style="width: 100%; margin-top: 10px; border-color: #ff4d4d; color: #ff4d4d"
          >
            ОТМЕНА
          </button>
        </div>
      </div>
    </div>
    <script src="words.js"></script>
    <script>
      // --- ЛОГИКА СЧЕТЧИКА ПОВТОРЕНИЙ ---
      let todayDate = new Date().toISOString().split('T')[0];
      let reviewStats = JSON.parse(
        localStorage.getItem('review_stats') || '{"date": "", "count": 0}',
      );

      // Если дата в памяти не совпадает с сегодняшней — обнуляем счетчик дня
      if (reviewStats.date !== todayDate) {
        reviewStats = { date: todayDate, count: 0 };
        localStorage.setItem('review_stats', JSON.stringify(reviewStats));
      }
      // Глобальная переменная для хранения текущей пачки из 20 слов
      let currentSelection = [];
      // Функция для повторного прослушивания текущего слова в режиме повторения
      function replayCurrentAudio() {
        if (currentReviewWord) {
          // Берем само английское слово, даже если сейчас режим rus-eng
          const wordToSpeak = currentReviewWord.word.split(',')[0];
          playAudio(wordToSpeak);
        }
      }
      // 1. Создание абсолютно нового списка по фильтрам
      function generateNewList() {
        const level = document.getElementById('filter-level').value;
        const type = document.getElementById('filter-type').value;

        let pool = allWords.filter((w) => !learnedWords.some((lw) => lw.word === w.word));

        if (level !== 'all') pool = pool.filter((w) => w.level.includes(level));
        if (type !== 'all') pool = pool.filter((w) => w.type.includes(type));

        currentSelection = pool.sort(() => 0.5 - Math.random()).slice(0, 20);
        renderTable();
      }

      // 2. Перемешивание только тех слов, что уже на экране
      function shuffleCurrentList() {
        if (currentSelection.length === 0) return;
        currentSelection.sort(() => 0.5 - Math.random());
        renderTable();
      }

      // 3. Отрисовка таблицы
      function renderTable() {
        const grid = document.getElementById('words-grid');
        grid.innerHTML = '';
        document.getElementById('table-container').style.display = 'block';

        currentSelection.forEach((w, i) => {
          const row = document.createElement('tr');
          row.innerHTML = `
              <td>${i + 1}</td>
              <td class="word-cell">
                  <span class="main-word" 
                        onclick="addHint('${w.word}')" 
                        onmouseover="showHint(event, '${w.word}')" 
                        onmouseout="hideHint()">
                        ${w.word}
                  </span>
                  <span class="word-tag">${w.type}</span>
              </td>
              <td class="phonetic-cell">${w.phonetic}</td>
              <td class="translation-cell hidden" onclick="this.classList.toggle('hidden')">
                  ${w.translation}
              </td>
              <td><button class="audio-icon" onclick="playAudio('${
                w.word.split(',')[0]
              }')">🔊</button></td>
              <td><div class="level-box">${w.level}</div></td>
              <td><button class="done-btn" onclick="saveAsLearned('${w.word.replace(
                /'/g,
                "\\'",
              )}', this)">✔</button></td>
          `;
          grid.appendChild(row);
        });
        updateCounter();
      }

      // --- Функционал ПОДСКАЗОК ---
      function addHint(word) {
        const currentHint = localStorage.getItem(`hint_${word}`) || '';
        const newHint = prompt(`Введите подсказку/ассоциацию для "${word}":`, currentHint);
        if (newHint !== null) {
          localStorage.setItem(`hint_${word}`, newHint);
        }
      }

      function showHint(event, word) {
        const hint = localStorage.getItem(`hint_${word}`);
        if (hint) {
          const tooltip = document.getElementById('tooltip');
          // Находим элемент-родитель (само слово)
          const target = event.currentTarget;

          tooltip.innerText = `💡 ${hint}`;
          tooltip.style.display = 'block';

          // Перемещаем подсказку внутрь элемента
          target.appendChild(tooltip);
        }
      }

      function hideHint() {
        const tooltip = document.getElementById('tooltip');
        tooltip.style.display = 'none';
        // Безопасно возвращаем в body
        document.body.appendChild(tooltip);
      }

      // --- Стандартные функции ---
      function playAudio(word) {
        const synth = window.speechSynthesis;
        const utter = new SpeechSynthesisUtterance(word);
        utter.lang = 'en-US';
        synth.speak(utter);
      }

      function saveAsLearned(word, btn) {
        const wordData = allWords.find((w) => w.word === word);
        if (wordData) {
          if (learnedWords.some((lw) => lw.word === word)) return;

          const learnedEntry = {
            ...wordData,
            learnedDate: new Date().toISOString().split('T')[0],
            timestampAdded: Date.now(),
            // РАЗДЕЛЬНАЯ СТАТИСТИКА
            stats: {
              eng: {
                views: 0,
                scores: { 0: 0, 1: 0, 2: 0, 3: 0, 4: 0 },
                totalEarned: 0,
                totalLost: 0,
              },
              rus: {
                views: 0,
                scores: { 0: 0, 1: 0, 2: 0, 3: 0, 4: 0 },
                totalEarned: 0,
                totalLost: 0,
              },
            },
            progress: {
              eng: { level: 1, nextReview: Date.now() },
              rus: { level: 1, nextReview: Date.now() },
            },
          };
          learnedWords.push(learnedEntry);
          localStorage.setItem('oxford_learned', JSON.stringify(learnedWords));

          // Твоя анимация удаления
          const row = btn.closest('tr');
          row.style.transform = 'translateX(50px)';
          row.style.opacity = '0';
          setTimeout(() => {
            row.remove();
            updateCounter();
          }, 300);
        }
      }
      function updateCounter() {
        const now = new Date().toISOString().split('T')[0];
        const currentTime = Date.now();

        // 1. По уровням
        ['A1', 'A2', 'B1', 'B2', 'C1'].forEach((lvl) => {
          const count = learnedWords.filter((w) => w.level.includes(lvl)).length;
          const el = document.getElementById(`stat-${lvl.toLowerCase()}`);
          if (el) el.innerText = count;
        });

        // 2. Новые слова для изучения
        document.getElementById('stat-avail-learn').innerText =
          allWords.length - learnedWords.length;

        // 3. РАЗДЕЛЬНОЕ ПОВТОРЕНИЕ
        const availEng = learnedWords.filter(
          (w) => w.progress?.eng.nextReview <= currentTime,
        ).length;
        const availRus = learnedWords.filter(
          (w) => w.progress?.rus.nextReview <= currentTime,
        ).length;

        document.getElementById('stat-avail-eng').innerText = availEng;
        document.getElementById('stat-avail-rus').innerText = availRus;

        // 4. Статистика дня
        document.getElementById('stat-today-new').innerText = learnedWords.filter(
          (w) => w.learnedDate === now,
        ).length;
        nextReviewWord;
        document.getElementById('stat-today-rev').innerText = reviewStats.count;

        // 5. Общий итог
        document.getElementById('learned-stat').innerText = learnedWords.length;
      }
      updateCounter();

      let currentReviewWord = null;
      let reviewMode = 'eng-rus'; // или 'rus-eng'
      let reviewSortOrder = 'random'; // 'random' или 'level'
      function startReview(mode, sortOrder) {
        reviewMode = mode;
        reviewSortOrder = sortOrder;

        // Скрываем ВСЁ лишнее, включая журнал
        document.getElementById('setup-panel').style.display = 'none';
        document.getElementById('table-container').style.display = 'none';
        document.getElementById('journal-screen').style.display = 'none'; // <-- ДОБАВИТЬ ЭТО

        document.getElementById('review-container').style.display = 'block';

        nextReviewWord();
      }
      function nextReviewWord() {
        const now = Date.now();
        const modeKey = reviewMode === 'eng-rus' ? 'eng' : 'rus';

        let available = learnedWords.filter((w) => {
          if (!w.progress)
            w.progress = { eng: { level: 1, nextReview: 0 }, rus: { level: 1, nextReview: 0 } };
          return w.progress[modeKey].nextReview <= now;
        });

        if (available.length === 0) {
          alert('Все слова повторены!');
          location.reload();
          return;
        }

        currentReviewWord = available[Math.floor(Math.random() * available.length)];

        // --- ЛАМПОВЫЙ ГЕНЕРАТОР СЕТКИ ---
        let bg = document.getElementById('card-bg');
        if (!bg) {
          bg = document.createElement('div');
          bg.id = 'card-bg';
          bg.innerHTML = '<div class="cyber-grid"></div><div class="cyber-nebula"></div>';
          document.querySelector('.review-card').prepend(bg);
        }

        const word = currentReviewWord.word;
        const seed = [...word].reduce((acc, char) => acc + char.charCodeAt(0), 0);

        const h1 = seed % 360;
        const h2 = (h1 + 40) % 360; // Близкие цвета для мягкости (не контрастные)

        // Настраиваем цвета
        bg.style.setProperty('--grid-color', `hsla(${h1}, 100%, 60%, 0.15)`);
        bg.style.setProperty('--grid-color-dim', `hsla(${h1}, 100%, 60%, 0.05)`);
        bg.style.setProperty('--main-color-trans', `hsla(${h1}, 80%, 25%, 0.7)`);
        bg.style.setProperty('--alt-color-trans', `hsla(${h2}, 80%, 20%, 0.5)`);

        // Рандомные точки тумана
        bg.style.setProperty('--px', (seed % 40) + 30 + '%');
        bg.style.setProperty('--py', (seed % 30) + 10 + '%');
        bg.style.setProperty('--sx', 100 - (seed % 50) + '%');
        bg.style.setProperty('--sy', (seed % 60) + '%');

        // --- ИНТЕРФЕЙС ---
        const wordDisp = document.getElementById('review-word-display');
        const transDisp = document.getElementById('review-translation');

        // Мягкое свечение текста
        wordDisp.style.color = `hsl(${h1}, 100%, 95%)`;
        wordDisp.style.textShadow = `0 0 15px hsla(${h1}, 100%, 50%, 0.5)`;

        // Остальная логика интерфейса без изменений
        document.getElementById('review-mode-badge').innerText =
          reviewMode === 'eng-rus' ? 'EN ➔ RU' : 'RU ➔ EN';
        document.getElementById(
          'review-level-tag',
        ).innerText = `LVL ${currentReviewWord.progress[modeKey].level}`;
        document.getElementById('rating-buttons').style.display = 'none';
        document.getElementById('show-answer-btn').style.display = 'inline-block';
        document.getElementById('review-replay-audio').style.display = 'none';
        transDisp.style.display = 'none';

        if (reviewMode === 'eng-rus') {
          wordDisp.innerText = currentReviewWord.word;
          transDisp.innerText = currentReviewWord.translation;
        } else {
          wordDisp.innerText = currentReviewWord.translation;
          transDisp.innerText = currentReviewWord.word;
        }
        document.getElementById('review-phonetic').innerText = currentReviewWord.phonetic;
      }
      function showReviewAnswer() {
        document.getElementById('review-translation').style.display = 'block';
        document.getElementById('show-answer-btn').style.display = 'none';
        document.getElementById('rating-buttons').style.display = 'flex';

        // Показываем кнопку повтора звука
        const replayBtn = document.getElementById('review-replay-audio');
        replayBtn.style.display = 'inline-block';

        playAudio(currentReviewWord.word);
      }

      function rateWord(score) {
        const msPerLevel = 10 * 60 * 1000;
        const modeKey = reviewMode === 'eng-rus' ? 'eng' : 'rus'; // 'eng' или 'rus'

        const index = learnedWords.findIndex((w) => w.word === currentReviewWord.word);

        if (index !== -1) {
          let targetWord = learnedWords[index];

          // Инициализация для старых слов, если их структура еще не обновлена
          if (!targetWord.stats || !targetWord.stats[modeKey]) {
            targetWord.stats = {
              eng: targetWord.stats?.eng || {
                views: 0,
                scores: { 0: 0, 1: 0, 2: 0, 3: 0, 4: 0 },
                totalEarned: 0,
                totalLost: 0,
              },
              rus: targetWord.stats?.rus || {
                views: 0,
                scores: { 0: 0, 1: 0, 2: 0, 3: 0, 4: 0 },
                totalEarned: 0,
                totalLost: 0,
              },
            };
          }

          // Записываем данные СТРОГО в текущий режим (eng или rus)
          const currentStats = targetWord.stats[modeKey];
          currentStats.views++;
          currentStats.scores[score]++;

          let p = targetWord.progress[modeKey];
          const oldLvl = p.level;

          // Логика изменения уровней (твоя без изменений)
          switch (score) {
            case 0:
              p.level = Math.max(1, p.level - 25);
              break;
            case 1:
              p.level = Math.max(1, p.level - 10);
              break;
            case 2:
              p.level += 5;
              break;
            case 3:
              p.level += 10;
              break;
            case 4:
              p.level += 100;
              break;
          }

          const diff = p.level - oldLvl;
          if (diff > 0) currentStats.totalEarned += diff;
          else currentStats.totalLost += Math.abs(diff);

          // Расчет следующего повторения
          p.nextReview = score <= 1 ? Date.now() : Date.now() + p.level * msPerLevel;

          localStorage.setItem('oxford_learned', JSON.stringify(learnedWords));
        }

        // Обновление интерфейса
        reviewStats.count++;
        localStorage.setItem('review_stats', JSON.stringify(reviewStats));
        updateCounter();
        nextReviewWord();
      }
      document.addEventListener('keydown', (e) => {
        // Если мы в режиме повторения
        if (document.getElementById('review-container').style.display === 'block') {
          const showBtn = document.getElementById('show-answer-btn');

          // Пробел - показать ответ
          if (e.code === 'Space' && showBtn.style.display !== 'none') {
            e.preventDefault();
            showReviewAnswer();
          }
          // Цифры 0-4 - поставить оценку (когда они видны)
          else if (['0', '1', '2', '3', '4'].includes(e.key)) {
            if (document.getElementById('rating-buttons').style.display === 'flex') {
              rateWord(parseInt(e.key));
            }
          }
        }
      });

      // --- ЗВУКОВАЯ СИСТЕМА ИНТЕРФЕЙСА (ОПТИМИЗИРОВАННАЯ) ---

      const hoverSound = new Audio('music/notification.mp3');
      hoverSound.volume = 0.05;

      function playHoverSound() {
        hoverSound.currentTime = 0;
        hoverSound.play().catch((e) => {}); // Игнорируем ошибки автоплея
      }

      // 1. Звук только при наведении на элементы управления (кнопки, селекты)
      document.addEventListener('mouseover', (e) => {
        const target = e.target;
        // Убрали main-word и translation-cell из наведения, чтобы не пиликало постоянно
        const isControl = target.closest('button') || target.closest('select');

        if (isControl) {
          playHoverSound();
        }
      });

      // 2. Звук только при КЛИКЕ на перевод (когда он закрашивается/открывается)
      document.addEventListener('click', (e) => {
        const translation = e.target.closest('.translation-cell');

        if (translation) {
          playHoverSound();

          // Визуальный отклик (вспышка)
          translation.classList.add('flash-active');
          setTimeout(() => {
            translation.classList.remove('flash-active');
          }, 200);
        }
      });

      let journalSortDir = 1;

      let currentJournalMode = 'eng'; // Глобальная переменная для режима журнала

      function setJournalMode(mode) {
        currentJournalMode = mode;
        // Визуальное переключение кнопок
        document.getElementById('j-mode-eng').classList.toggle('active', mode === 'eng');
        document.getElementById('j-mode-rus').classList.toggle('active', mode === 'rus');
        playHoverSound();
        renderJournal();
      }

      function showJournal() {
        document.getElementById('setup-panel').style.display = 'none';
        document.getElementById('table-container').style.display = 'none';
        document.getElementById('review-container').style.display = 'none';
        document.getElementById('journal-screen').style.display = 'block';

        document
          .querySelectorAll('.nav-header .glass-button')
          .forEach((btn) => btn.classList.remove('active'));
        const journalBtn = Array.from(document.querySelectorAll('.nav-header .glass-button')).find(
          (el) => el.textContent === 'Журнал',
        );
        if (journalBtn) journalBtn.classList.add('active');

        window.scrollTo(0, 0);
        renderJournal();
      }
      function renderJournal() {
        const grid = document.getElementById('journal-grid');
        grid.innerHTML = '';

        learnedWords.forEach((w) => {
          const days = Math.floor(
            (Date.now() - (w.timestampAdded || Date.now())) / (1000 * 60 * 60 * 24),
          );

          // Берем прогресс и статику ТОЛЬКО для текущего режима (eng или rus)
          const p = w.progress?.[currentJournalMode] || { level: 1 };
          const s = w.stats?.[currentJournalMode] || {
            views: 0,
            scores: { 0: 0, 1: 0, 2: 0, 3: 0, 4: 0 },
            totalEarned: 0,
            totalLost: 0,
          };

          const row = document.createElement('tr');

          // Для визуального отличия: в режиме RU->EN подсвечиваем перевод
          const wordDisplay =
            currentJournalMode === 'eng'
              ? `<b>${w.word}</b>`
              : `<b style="color: #00f2fe">${w.translation}</b> <small style="opacity:0.4">(${w.word})</small>`;

          row.innerHTML = `
        <td style="text-align:left">${wordDisplay}</td>
        <td><div class="level-box">${p.level}</div></td>
        <td>${s.views}</td>
        <td>${days} дн.</td>
        <td style="color:#ff4d4d">${s.scores[0]}</td>
        <td style="color:#ffa500">${s.scores[1]}</td>
        <td style="color:#ffff00">${s.scores[2]}</td>
        <td style="color:#90ee90">${s.scores[3]}</td>
        <td style="color:#00ff00">${s.scores[4]}</td>
        <td><span style="color:#00ff00">+${s.totalEarned}</span> / <span style="color:#ff4d4d">-${s.totalLost}</span></td>
    `;
          grid.appendChild(row);
        });
      }
      function sortJournal(prop) {
        // Переключаем направление (1 — по возрастанию, -1 — по убыванию)
        journalSortDir *= -1;

        learnedWords.sort((a, b) => {
          let valA, valB;

          // Получаем актуальную статистику и прогресс в зависимости от режима журнала
          const stA = a.stats?.[currentJournalMode] || {
            views: 0,
            scores: { 0: 0, 1: 0, 2: 0, 3: 0, 4: 0 },
            totalEarned: 0,
            totalLost: 0,
          };
          const stB = b.stats?.[currentJournalMode] || {
            views: 0,
            scores: { 0: 0, 1: 0, 2: 0, 3: 0, 4: 0 },
            totalEarned: 0,
            totalLost: 0,
          };
          const prA = a.progress?.[currentJournalMode] || { level: 1 };
          const prB = b.progress?.[currentJournalMode] || { level: 1 };

          // Распределяем значения для сравнения
          switch (prop) {
            case 'word':
              valA = a.word.toLowerCase();
              valB = b.word.toLowerCase();
              break;
            case 'level':
              valA = prA.level;
              valB = prB.level;
              break;
            case 'views':
              valA = stA.views;
              valB = stB.views;
              break;
            case 'days':
              valA = a.timestampAdded || 0;
              valB = b.timestampAdded || 0;
              break;
            case 'diff':
              valA = stA.totalEarned - stA.totalLost;
              valB = stB.totalEarned - stB.totalLost;
              break;
            default:
              // Обработка score0, score1 и т.д.
              if (prop.startsWith('score')) {
                const num = prop.replace('score', '');
                valA = stA.scores[num] || 0;
                valB = stB.scores[num] || 0;
              }
          }

          if (valA < valB) return -1 * journalSortDir;
          if (valA > valB) return 1 * journalSortDir;
          return 0;
        });

        renderJournal();
      }
      let selectedMode = 'eng-rus';
      let selectedSort = 'random';

      function showReviewOptions() {
        // Вместо алертов просто показываем наше окно
        document.getElementById('review-modal').style.display = 'flex';
      }

      function closeModal() {
        document.getElementById('review-modal').style.display = 'none';
      }

      function selectOption(type, value) {
        if (type === 'mode') {
          selectedMode = value;
          document.getElementById('mode-en-ru').classList.toggle('active', value === 'eng-rus');
          document.getElementById('mode-ru-en').classList.toggle('active', value === 'rus-eng');
        } else {
          selectedSort = value;
          document.getElementById('sort-random').classList.toggle('active', value === 'random');
          document.getElementById('sort-level').classList.toggle('active', value === 'level');
        }
        // Добавим звуковой эффект при клике, если хочешь
        playHoverSound();
      }

      function confirmReviewStart() {
        closeModal();
        // Скрываем журнал перед стартом, чтобы не было бага с наложением
        document.getElementById('journal-screen').style.display = 'none';
        startReview(selectedMode, selectedSort);
      }
    </script>
  </body>
</html>
